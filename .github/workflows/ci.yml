name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps --ignore-scripts && exit 0
            echo "npm ci failed (attempt ${attempt}/3), retrying in 10s..."
            sleep 10
          done
          exit 1
      - name: Audit
        # EVERY lockfile the repo tracks, not just the root: `example/package-lock.json` pinned
        # vulnerable versions for months because nothing audited it (#48). The root is audited as
        # installed; the rest are read from disk, since a nested tree has no node_modules here.
        run: |
          status=0
          npm audit --audit-level=moderate || status=1
          for lock in $(git ls-files '*/package-lock.json'); do
            echo "::group::npm audit $(dirname "$lock")"
            ( cd "$(dirname "$lock")" && npm audit --package-lock-only --audit-level=moderate ) || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Verify npm signatures
        run: npm audit signatures
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        # `npm run typecheck` was failing on main with nothing watching it (#47).
        run: npm run typecheck
      - name: Verify contract version matches the package version
        run: npx cli-contracts version-sync --check
      - name: Build
        run: npm run build
      - name: Bundle
        run: npm run bundle:min
      - name: Test
        run: npm run test:ci
      - name: Verify package contents
        run: npm pack --dry-run
